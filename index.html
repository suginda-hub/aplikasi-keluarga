<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web Terintegrasi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Koneksi GitHub Pages ke Google Apps Script</h1>
    <p>Klik tombol di bawah untuk menguji koneksi data ke Google Script Anda.</p>
    
    <button onclick="panggilScript()">Tes Koneksi Data</button>

    <script>
  // URL Web App Google Script Anda
  const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxZQVbIxNS9yfIC0Vf7YE8zQHEF6F6iigIQDAbn_wq6kS2R3n0m2_k-Lf3Jn6ZVaj0/exec";

  function panggilScript() {
    fetch(URL_WEB_APP, {
      method: 'GET', // Atur metode
      mode: 'cors',  // Pastikan membaca lintas asal
      redirect: 'follow' // Wajib untuk mengikuti redirect dari Google
    })
    .then(res => {
      if (!res.ok) {
        throw new Error('Jaringan bermasalah atau URL salah.');
      }
      return res.json();
    })
    .then(data => {
      alert("Berhasil terhubung! Respons data: " + JSON.stringify(data));
    })
    .catch(err => {
      alert("Error! Periksa kembali pengaturan Deployment Google Script (harus 'Anyone').");
      console.error("Detail Error:", err);
    });
  }
</script>
</body>
</html>
